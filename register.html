<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account — Smart Helmet Safety System</title>
  <meta name="description" content="Register a new user account for the Smart Helmet Emergency Alert System.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">

  <div style="width: 100%; max-width: 480px;">
    
    <!-- Branding Header -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" style="display: inline-flex; align-items: center; gap: 0.75rem; text-decoration: none;">
        <div class="logo-badge" style="width: 48px; height: 48px; font-size: 1.5rem;">
          <i class="fa-solid fa-helmet-safety"></i>
        </div>
        <div style="text-align: left;">
          <h1 style="font-size: 1.25rem; font-weight: 800; color: #fff; line-height: 1.2;">Smart Helmet Safety System</h1>
          <span style="font-size: 0.75rem; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;">Control & Dispatch Portal</span>
        </div>
      </a>
    </div>

    <!-- Register Card -->
    <div class="card" style="box-shadow: var(--shadow-lg);">
      <div style="margin-bottom: 1.5rem;">
        <h2 style="font-size: 1.3rem; font-weight: 700; color: #ffffff;">Create Account</h2>
        <p style="font-size: 0.82rem; color: var(--text-secondary); margin-top: 0.25rem;">
          Register as an emergency dispatcher or motorcyclist rider.
        </p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="regName">Full Name <span class="required">*</span></label>
          <input type="text" id="regName" class="form-control" placeholder="e.g. Officer John Davis" required autocomplete="name">
          <div class="form-error" id="err_reg_name"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Email Address <span class="required">*</span></label>
          <input type="email" id="regEmail" class="form-control" placeholder="john.davis@rescue-team.org" required autocomplete="email">
          <div class="form-error" id="err_reg_email"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regRole">Account Role <span class="required">*</span></label>
          <select id="regRole" class="form-control" required>
            <option value="Emergency Dispatcher">Emergency Dispatcher (HQ Monitor)</option>
            <option value="Rider">Motorcyclist / Rider</option>
            <option value="Fleet Supervisor">Fleet Safety Supervisor</option>
          </select>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label class="form-label" for="regPassword" style="margin-bottom: 0;">Password <span class="required">*</span></label>
            <span style="font-size: 0.74rem; color: var(--text-muted);">Min. 6 characters</span>
          </div>
          <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required autocomplete="new-password">
          <div class="form-error" id="err_reg_password"></div>
        </div>

        <button type="submit" class="btn btn-primary" id="regSubmitBtn" style="width: 100%; margin-top: 0.5rem;">
          <i class="fa-solid fa-user-plus"></i> Complete Registration
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.84rem; color: var(--text-secondary); border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
        Already have an account? <a href="login.html" style="font-weight: 600;">Sign In</a>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/database.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('registerForm');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const role = document.getElementById('regRole').value;
        const password = document.getElementById('regPassword').value;
        const submitBtn = document.getElementById('regSubmitBtn');

        // Clear error states
        document.querySelectorAll('.form-control').forEach(el => el.classList.remove('is-invalid'));
        document.querySelectorAll('.form-error').forEach(el => el.style.display = 'none');

        if (!name) {
          const el = document.getElementById('regName');
          el.classList.add('is-invalid');
          const err = document.getElementById('err_reg_name');
          err.textContent = 'Please enter your full name.';
          err.style.display = 'block';
          return;
        }

        if (!Validator.isValidEmail(email)) {
          const el = document.getElementById('regEmail');
          el.classList.add('is-invalid');
          const err = document.getElementById('err_reg_email');
          err.textContent = 'Please provide a valid email.';
          err.style.display = 'block';
          return;
        }

        if (!Validator.isValidPassword(password)) {
          const el = document.getElementById('regPassword');
          el.classList.add('is-invalid');
          const err = document.getElementById('err_reg_password');
          err.textContent = 'Password must be at least 6 characters.';
          err.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating Profile...';

        try {
          await Auth.register(name, email, password, role);
          UI.showToast(`Account created for ${name}. Welcome to Smart Helmet Safety System!`, 'success');
          setTimeout(() => window.location.href = 'dashboard.html', 500);
        } catch (err) {
          UI.showToast(err.message, 'danger');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Complete Registration';
        }
      });
    });
  </script>
</body>
</html>
